name: Build, testes e publicacao estatica
on:
  push:
    branches: [main]
    paths-ignore:
      - 'static/**'
      - 'index.html'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prévia técnica da fachada
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, io
          from PIL import Image
          pic = Image.open('assets/portfolio/fachada-contemporanea.png').convert('RGB')
          pic.thumbnail((440, 300))
          out = io.BytesIO()
          pic.save(out, format='JPEG', quality=58, optimize=True)
          print('HERO-PREVIEW-BEGIN:' + base64.b64encode(out.getvalue()).decode() + ':HERO-PREVIEW-END')
          print('ORIGINAL-DIMENSIONS:', Image.open('assets/portfolio/fachada-contemporanea.png').size)
          PY
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar
        run: npm run build
      - name: Conferir distribuicao estatica
        run: |
          test -s dist/index.html
          test -d dist/static
          test -f dist/assets/identidade/logo-stela-maris.png
          test -f dist/assets/portfolio/fachada-contemporanea.png
          test -f dist/favicon.svg
          grep -q '/static/' dist/index.html
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Testes navegador
        run: npm run test:e2e
      - name: Publicar build estatico na main
        run: |
          cp dist/index.html index.html
          rm -rf static
          cp -R dist/static static
          git add index.html static package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: site estatico pronto para Hostinger [skip ci]'
            git push origin HEAD:main
          fi
      - name: Capturas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-web
          path: |
            test-results/
            playwright-report/
          retention-days: 7
